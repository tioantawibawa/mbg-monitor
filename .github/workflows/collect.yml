name: Daily MBG collection
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Collect from January 2026 (national weekly windows)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: mbg-data-writer
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install tzdata
      - name: Validate register and test collector
        run: python -m unittest discover -s tests -v
      - name: Collect RSS metadata
        id: scrape
        continue-on-error: true
        env:
          BACKFILL: ${{ inputs.backfill }}
        run: |
          if [ "$BACKFILL" = "true" ]; then
            python -m src.collect --backfill
          else
            python -m src.collect --regional
          fi
      - name: Rebuild title-derived estimates
        if: always()
        run: python -m src.rebuild_estimates
      - name: Persist data and collection health
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/articles.json data/health.json data/runs.json
          git add data/victim_estimates.json data/victims_by_province.csv data/victims_timeseries.csv
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh MBG news and collection health'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Report incomplete collection
        if: steps.scrape.outcome == 'failure'
        run: exit 1
